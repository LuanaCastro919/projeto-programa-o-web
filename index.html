<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volume Memory - Etapa 1</title>
  <link rel="stylesheet" href="style.css">
</head>

<!-- ETAPA 1: a tela e as cartas (ainda sem regras do jogo)
     O que já funciona: criar o tabuleiro com JavaScript e virar as cartas ao clicar.
     Falta: pares, erros, volume e mensagens. -->

<!-- Evento INLINE: quando a página carrega, chama iniciarJogo() -->
<body onload="iniciarJogo()">

  <!-- Evento INLINE no título: mouseover e mouseout -->
  <h1 id="titulo"
      onmouseover="destacarTitulo(event)"
      onmouseout="destacarTitulo(event)">
    Volume: <span id="volume-display">30</span>
  </h1>

  <!-- Área vazia: o tabuleiro inteiro é criado pelo JavaScript -->
  <div id="area-jogo"></div>

  <script>
    /* ---------- Dados do jogo ---------- */
    var figuras = [
      { id: 1, nome: "Personagem 1", src: "imagens/personagem1.png" },
      { id: 2, nome: "Personagem 2", src: "imagens/personagem2.png" },
      { id: 3, nome: "Personagem 3", src: "imagens/personagem3.png" },
      { id: 4, nome: "Personagem 4", src: "imagens/personagem4.png" },
      { id: 5, nome: "Personagem 5", src: "imagens/personagem5.png" }
    ];
    var imagemVerso = "imagens/verso.png";   // imagem da carta de costas
    var volume = 30;                         // volume inicial

    /* ---------- Seletores: document.getElementById() ---------- */
    var titulo        = document.getElementById("titulo");
    var volumeDisplay = document.getElementById("volume-display");
    var areaJogo      = document.getElementById("area-jogo");

    /* ---------- Evento inline: event.type ---------- */
    function destacarTitulo(event) {
      if (event.type === "mouseover") {
        titulo.style.color = "gold";     // style: muda o CSS pelo JS
      } else {
        titulo.style.color = "";         // "" = volta ao CSS original
      }
    }

    /* ---------- Chamada pelo onload ---------- */
    function iniciarJogo() {
      volumeDisplay.textContent = volume;            // textContent

      var tabuleiro = document.createElement("div"); // createElement
      tabuleiro.classList.add("tabuleiro");          // classList.add
      tabuleiro.setAttribute("id", "tabuleiro");     // setAttribute
      areaJogo.appendChild(tabuleiro);               // appendChild

      montarCartas();
    }

    /* ---------- Cria as 10 cartas (5 pares) ---------- */
    function montarCartas() {
      var tabuleiro = document.getElementById("tabuleiro");
      tabuleiro.textContent = "";

      // cada figura entra duas vezes
      var ids = [];
      for (var i = 0; i < figuras.length; i++) {
        ids.push(figuras[i].id);
        ids.push(figuras[i].id);
      }
      ids = embaralhar(ids);

      for (var n = 0; n < ids.length; n++) {
        var carta = document.createElement("div");
        carta.classList.add("carta");
        carta.setAttribute("data-carta", n + 1);        // número da carta
        carta.setAttribute("data-figura", ids[n]);      // qual figura ela esconde

        var img = document.createElement("img");
        img.setAttribute("src", imagemVerso);           // começa de costas
        img.alt = "Carta virada para baixo";
        carta.appendChild(img);

        // eventos ligados via JavaScript
        carta.onclick = cliqueNaCarta;
        carta.onmouseenter = entrouNaCarta;
        carta.onmouseout = saiuDaCarta;

        tabuleiro.appendChild(carta);
      }
    }

    // Embaralha uma lista (Fisher-Yates)
    function embaralhar(lista) {
      for (var i = lista.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var guardado = lista[i];
        lista[i] = lista[j];
        lista[j] = guardado;
      }
      return lista;
    }

    /* ---------- Clique na carta ---------- */
    function cliqueNaCarta(event) {
      // event.target pode ser a <img>; se for, sobe para a carta (parentElement)
      var carta = event.target;
      if (carta.tagName === "IMG") {
        carta = carta.parentElement;
      }

      var idFigura = Number(carta.getAttribute("data-figura"));   // getAttribute
      var img = carta.firstElementChild;                          // a <img> da carta

      // classList.toggle: liga/desliga a classe "virada"
      carta.classList.toggle("virada");

      // classList.contains: está virada agora?
      if (carta.classList.contains("virada")) {
        img.setAttribute("src", figuras[idFigura - 1].src);
        img.alt = figuras[idFigura - 1].nome;
      } else {
        img.setAttribute("src", imagemVerso);
        img.alt = "Carta virada para baixo";
      }
    }

    /* ---------- Eventos de mouse nas cartas ---------- */
    function entrouNaCarta(event) {
      event.target.style.borderRadius = "24px";
    }
    function saiuDaCarta(event) {
      event.target.style.borderRadius = "";
    }
  </script>
</body>
</html>
